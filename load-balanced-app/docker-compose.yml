services:
  db:
    image: postgres:17
    container_name: load_balanced_app_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:alpine
    container_name: load_balanced_app_redis
    ports:
      - "6379:6379"
    networks:
      - app-net

  api-instance-1:
    build: .
    container_name: load_balanced_app_1
    env_file:
      - .env
    environment:
      - INSTANCE_NAME=API-Instance-1
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - SPRING_DATA_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  api-instance-2:
    build: .
    container_name: load_balanced_app_2
    env_file:
      - .env
    environment:
      - INSTANCE_NAME=API-Instance-2
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - SPRING_DATA_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_REDIS_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: load_balanced_app_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-instance-1
      - api-instance-2
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge