<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos SSE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Produtos</h1>
        <span id="status" class="status offline">Desconectado</span>
    </header>

    <form id="product-form" class="card form-card">
        <div class="form-group">
            <label for="name">Nome do Produto *</label>
            <input type="text" id="name" placeholder="Ex: Teclado Mecânico" required>
        </div>

        <div class="form-group">
            <label for="price">Preço (R$) *</label>
            <input type="number" id="price" step="0.01" placeholder="Ex: 299.90" required>
        </div>

        <div class="form-group">
            <label for="stock">Estoque *</label>
            <input type="number" id="stock" min="0" placeholder="Ex: 10" required>
        </div>

        <div class="form-group">
            <label for="description">Descrição (Opcional)</label>
            <input type="text" id="description" placeholder="Ex: Teclado RGB switch blue">
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
    </form>

    <main class="card list-card">
        <h2>Produtos Cadastrados</h2>
        <ul id="product-list"></ul>
    </main>
</div>
<script src="script.js" defer></script>
</body>
</html>
